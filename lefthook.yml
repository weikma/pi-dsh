# Optional Lefthook checks for the Pi DSH workspace; CI owns the platform matrix.
pre-commit:
  jobs:
    - name: whitespace
      run: git diff --cached --check
    - name: documentation
      run: pnpm test:docs
    - name: lint
      run: pnpm lint

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
