name: Pi DSH
on: [push, pull_request]
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pi:install 0.99.1
      - run: pnpm test:runtime
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:ui
      - run: pnpm test:compat
      - run: pnpm build
      - run: pnpm package:desktop --dir
      - run: pnpm lint
      - run: pnpm test:docs
      - run: pnpm test:names
